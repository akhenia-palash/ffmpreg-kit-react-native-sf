apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.arthenica.ffmpegkit'
    }
    compileSdk 33
    ndkVersion "22.1.7171670"

    defaultConfig {
        minSdk 24
        targetSdk 33
        versionCode 240600
        versionName "6.0"
        project.archivesBaseName = "ffmpeg-kit"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            // package shared object libraries built by ndk-build under android/obj/local
            jniLibs.srcDirs = ["../obj/local"]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            systemProperty 'enable.ffmpeg.kit.test.mode', 'true'
        }
    }


    publishing {
        singleVariant('release') {
            withJavadocJar()
            withSourcesJar()
        }
    }
}

task javadoc(type: Javadoc) {
    title = 'FFmpegKit'
    destinationDir = file("${projectDir}/../../docs/android/javadoc")
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    source = android.sourceSets.main.java.srcDirs
    configurations.implementation.setCanBeResolved(true)
    classpath += configurations.implementation
}

task inspectSoAlignment {
    group = 'verification'
    description = 'Inspect the program header alignments of Android shared libraries produced by ndk-build.'
    doLast {
        def soRoot = file("${projectDir}/../obj/local")
        if (!soRoot.exists()) {
            throw new GradleException("NDK build output not found: $soRoot")
        }

        fileTree(soRoot).matching { include '**/*.so' }.files.sort().each { File soFile ->
            println "Inspecting ${soFile.absolutePath}"
            def output = new ByteArrayOutputStream()
            exec {
                commandLine 'readelf', '-l', soFile.absolutePath
                standardOutput = output
                errorOutput = output
                ignoreExitValue = true
            }
            output.toString().eachLine { line ->
                if (line.contains('LOAD') || line.contains('Align')) {
                    println line
                }
            }
            println()
        }
    }
}

dependencies {
    api 'com.arthenica:smart-exception-java:0.2.1'
    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation 'org.json:json:20230618'
}
